name: "assert break/continue: markers for 5,4; 3 skipped; stops before 2"
limit: 200
memory_size: 0x100
reports:
  - name: Check result
    slice: last
    view: |
      stack: {stack:dec}
    assert: |
      stack: 4:5
  - name: Stack layout
    slice: all
    view: |
      pc: {pc}
      {layout:dec}
