name: "Random memory initialization"
limit: 10
memory_size: 0x40
reports:
  - name: Explicitly initialized data (stays 0xDEADBEEF)
    slice: last
    view: |
      {memory:0x0:0x3}
  - name: Unallocated memory (random bytes; different on every run -- pin `seed:` to reproduce)
    slice: last
    view: |
      {memory:0x20:0x2f}
