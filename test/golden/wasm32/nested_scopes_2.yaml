name: "regression: i32.add across a block/loop boundary must not corrupt the open LoopScope"
limit: 200
memory_size: 0x200
reports:
  - name: Check result
    slice: last
    view: |
      stack: {stack:dec}
    assert: |
      stack: 3
  - name: Stack layout
    slice: all
    view: |
      :::: {pc:hex}: {instruction:prev} {pc:label}
      {layout:hex}
