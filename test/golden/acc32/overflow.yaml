name: error symbols output
limit: 400
memory_size: 0x1000
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc}:	{instruction:next}	{pc:label} Acc: {Acc} Overflow: {V} Carry: {C}
    assert: |
      16:	Load (-16)	@_start Acc: 0 Overflow: 0 Carry: 0
      18:	Add 8	 Acc: 2147483647 Overflow: 0 Carry: 0
      21:	Bvs 27	 Acc: -2147483648 Overflow: 1 Carry: 0
      27:	Clv	@clean_overflow Acc: -2147483648 Overflow: 1 Carry: 0
      28:	Add 12	 Acc: -2147483648 Overflow: 0 Carry: 0
      31:	Clv	 Acc: 2147483647 Overflow: 1 Carry: 1
      32:	Clc	 Acc: 2147483647 Overflow: 0 Carry: 1
      33:	Load (-29)	 Acc: 2147483647 Overflow: 0 Carry: 0
      35:	Add 8	 Acc: -1 Overflow: 0 Carry: 0
      38:	Bcs 44	 Acc: 0 Overflow: 0 Carry: 1
      44:	Clc	@clean_carry Acc: 0 Overflow: 0 Carry: 1
      45:	Halt	 Acc: 0 Overflow: 0 Carry: 0
      45:	-	 Acc: 0 Overflow: 0 Carry: 0
