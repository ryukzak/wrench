name: "what each instruction costs in memory accesses"
limit: 300
memory_size: 0x400
reports:
  - name: Access cost per instruction
    slice: all
    view: |
      reads: {mem:reads:dec}, writes: {mem:writes:dec} -- {instruction:prev}
  - name: Totals
    slice: last
    view: |
      instructions: {sim:instruction-count}
      reads: {mem:reads-total:dec} writes: {mem:writes-total:dec} accesses: {mem:accesses-total:dec}
