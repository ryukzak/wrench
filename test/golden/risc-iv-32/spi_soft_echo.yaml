name: "SPI bitbang echoes one word via CS/CLK/MOSI/MISO"
limit: 500
memory_size: 0x1000
spi:
  0x90:
    mode: software
    input:
      - [0xA5, 0]
reports:
  - name: Check SPI bitbang
    slice: last
    filter:
      - state
    view: |
      spi_miso[0x90]: {spi:0x90:miso}
      spi_mosi[0x90]: {spi:0x90:mosi}
      spi_status[0x90]: {spi:0x90:status}
      spi_clock[0x90]: {spi:0x90:clock}
      spi_pins[0x90]: {spi:0x90:pins}
    assert: |
      spi_miso[0x90]: [] >>> [(165,0)]
      spi_mosi[0x90]: [] >>> [(165,32)]
      spi_status[0x90]: miso_empty
      spi_clock[0x90]: 32
      spi_pins[0x90]: cs=1 clk=0 mosi=0 miso=0
