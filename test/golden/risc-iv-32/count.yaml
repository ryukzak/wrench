limit: 200
memory_size: 0x90
memory_mapped_io:
  88: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc}:	{instruction:next}	{t0:hex} {t1:hex} {t2:hex} {t3:hex} {pc:label}
  - name: Result
    slice: last
    view: |
      {mem:dump:4:7}
      {io:88:dec}
      {io:88:hex}
      {io:88:sym}
  - name: Memory accesses per instruction
    slice: last
    view: |
      {profile}
