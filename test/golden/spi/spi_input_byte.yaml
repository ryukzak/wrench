name: "SPI input byte echo"
limit: 2000
memory_size: 0x1000
spi:
  0:
    mode: 0
    cs_bit:
      address: 0x90
      bit: 0
    clk_bit:
      address: 0x90
      bit: 1
    mosi_bit:
      address: 0x90
      bit: 2
    miso_bit:
      address: 0x94
      bit: 0
    input:
      - at: 0
        byte: 0xA5
      - at: 8
        byte: 0
reports:
  - name: Check SPI byte input
    slice: last
    filter:
      - state
    view: |
      spi_miso[0]: {spi:0:miso}
      spi_mosi[0]: {spi:0:mosi}
      spi_status[0]: {spi:0:status}
      spi_clock[0]: {spi:0:clock}
      spi_pins[0]: {spi:0:pins}
    assert: |
      spi_miso[0]: [] >>> [(165,0),(0,8)]
      spi_mosi[0]: [] >>> [(165,8),(0,16)]
      spi_status[0]: miso_empty
      spi_clock[0]: 16
      spi_pins[0]: cs=1 clk=0 mosi=0 miso=0
