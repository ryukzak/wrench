name: wrench CI

on:
  pull_request:
  push:

jobs:
  haskell-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.20.1.0"

  html-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Biome format check
        run: make format-check-html

      - name: Run Biome lint
        run: make lint-html

  markdown-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Run mdl for check markdown format
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.yaml

  wrench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v6
        name: Cache ~/.stack
        with:
          path: ${{ '~/.stack' }}
          key: wrench-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Install haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
          ghc-version: "9.10.3"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Test
        run: make test-hs

      - name: Test examples
        run: make test-examples

      - name: Build
        run: make build

      - name: Build examples
        run: make build-examples

      - uses: gacts/install-hurl@v1

      - name: Test server
        run: make test-server

  haskell-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Run HLint"
        uses: haskell-actions/hlint-scan@v1.3.0
        with:
          fail-on: warning

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./script"
          version: "0.16.2"

  python-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: jakebailey/pyright-action@v3
        with:
          version: "1.1.413"

  is-variants-and-tests-actual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: make generate-variants
      - run: git diff --exit-code

  is-stack-deps-actual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v6
        name: Cache ~/.stack
        with:
          path: ${{ '~/.stack' }}
          key: is-stack-deps-actual-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Install haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
          ghc-version: "9.10.3"

      - run: make generate-stack-deps
      - run: git diff --exit-code

  haddock:
    needs:
      - wrench
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v6
        name: Cache ~/.stack
        with:
          path: ${{ '~/.stack' }}
          key: haddock-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Install haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
          ghc-version: "9.10.3"

      - name: Build Haddock docs
        run: make docs-haddock

      - name: Locate docs output
        id: docs
        run: |
          dist_dir=$(stack path --dist-dir)
          hackage_dir=$(ls -d "$dist_dir"/doc/html/wrench-*-docs)
          echo "path=$hackage_dir" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.docs.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-binaries:
    needs:
      - wrench
      - haskell-lint
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies on *nix
        uses: actions/cache@v6
        if: startsWith(runner.os, 'Linux') || startsWith(runner.os, 'macOS')
        with:
          path: ${{ '~/.stack' }}
          key: build-binaries-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Cache dependencies on Windows
        if: startsWith(runner.os, 'Windows')
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Roaming\stack
            ~\AppData\Local\Programs\stack
            C:\sr
          key: build-binaries-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Install haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
          ghc-version: "9.10.3"

      - name: Resolve version metadata
        id: version
        shell: bash
        run: |
          echo "git_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git log HEAD -1 --format=%cd)" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GIT_HASH: ${{ steps.version.outputs.git_hash }}
          GIT_DATE: ${{ steps.version.outputs.git_date }}
        run: |
          stack build --copy-bins --local-bin-path ./dist

      - name: Prepare release archive
        run: |
          tar -czvf wrench-${{ runner.os }}-${{ runner.arch }}.tar.gz -C ./dist .

      - name: Upload Binary as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wrench-${{ runner.os }}-${{ runner.arch }}
          path: wrench-${{ runner.os }}-${{ runner.arch }}.tar.gz

  publish-release:
    needs:
      - build-binaries
      - haskell-formatting
      - html-formatting
      - markdown-formatting
      - python-lint
      - python-typecheck
      - haskell-lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - run: find ./release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

  # Images for a tag: one native build per platform, joined into a manifest
  # list by publish-release-image. Emulated cross-builds of GHC -O2 are far too
  # slow to run here.
  build-release-image:
    needs:
      - wrench
      - haskell-lint
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version metadata
        id: version
        run: |
          echo "git_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git log HEAD -1 --format=%cd)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.platform }}
          build-args: |
            GIT_HASH=${{ steps.version.outputs.git_hash }}
            GIT_DATE=${{ steps.version.outputs.git_date }}
          outputs: type=image,name=ryukzak/wrench,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: release-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-release-image:
    needs: build-release-image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: release-digest-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest list
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            -t ryukzak/wrench:${{ github.ref_name }} \
            -t ryukzak/wrench:latest \
            $(printf 'ryukzak/wrench@sha256:%s ' *)

      - name: Verify published image
        run: |
          script/check-image-version.sh ryukzak/wrench:${{ github.ref_name }} "" ${{ github.ref_name }}
          script/check-image-version.sh ryukzak/wrench:latest "" ${{ github.ref_name }}

  # use `make release-image NEW_VERSION=X.Y.Z` to trigger it
  deploy-release:
    needs:
      - publish-release
      - publish-release-image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: |
          curl -X POST -H "Content-Type: application/json" --fail-with-body \
            -d '{"task": "wrench-serv", "secret": "${{ secrets.DEPLOY_EDGE_WEBHOOK }}", "async":true}' \
            https://updater.edu.swampbuds.me/update

  build-edge-image:
    needs:
      - wrench
      - is-variants-and-tests-actual
      - is-stack-deps-actual
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version metadata
        id: version
        run: |
          echo "git_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git log HEAD -1 --format=%cd)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: Dockerfile
          tags: ryukzak/wrench:edge
          platforms: linux/arm64
          cache-from: type=gha,scope=edge-linux-arm64
          cache-to: type=gha,mode=max,scope=edge-linux-arm64
          build-args: |
            VERSION_SUFFIX=EDGE
            GIT_HASH=${{ steps.version.outputs.git_hash }}
            GIT_DATE=${{ steps.version.outputs.git_date }}

      - name: Verify version metadata
        run: script/check-image-version.sh ryukzak/wrench:edge EDGE

  deploy-edge:
    needs: build-edge-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: |
          curl -X POST -H "Content-Type: application/json" --fail-with-body \
            -d '{"task": "wrench-serv-edge", "secret": "${{ secrets.DEPLOY_EDGE_WEBHOOK }}", "async":true}' \
            https://updater.edu.swampbuds.me/update
