name: wrench CI

on:
  pull_request:
  push:

jobs:
  haskell-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.20.1.0"

  html-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Biome format check
        run: make format-check-html

      - name: Run Biome lint
        run: make lint-html

  markdown-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Run mdl for check markdown format
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.yaml

  wrench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v6
        name: Cache ~/.stack
        with:
          path: ${{ '~/.stack' }}
          key: wrench-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Install haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
          ghc-version: "9.10.3"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Test
        run: make test-hs

      - name: Test examples
        run: make test-examples

      - name: Build
        run: make build

      - name: Build examples
        run: make build-examples

      - uses: gacts/install-hurl@v1

      - name: Test server
        run: make test-server

  haskell-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Run HLint"
        uses: haskell-actions/hlint-scan@v1.3.0
        with:
          fail-on: warning

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./script"
          version: "0.16.2"

  python-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: jakebailey/pyright-action@v3
        with:
          version: "1.1.413"

  is-variants-and-tests-actual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: make generate-variants
      - run: git diff --exit-code

  is-stack-deps-actual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v6
        name: Cache ~/.stack
        with:
          path: ${{ '~/.stack' }}
          key: is-stack-deps-actual-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Install haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
          ghc-version: "9.10.3"

      - run: make generate-stack-deps
      - run: git diff --exit-code

  haddock:
    needs:
      - wrench
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v6
        name: Cache ~/.stack
        with:
          path: ${{ '~/.stack' }}
          key: haddock-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Install haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
          ghc-version: "9.10.3"

      - name: Build Haddock docs
        run: make docs-haddock

      - name: Locate docs output
        id: docs
        run: echo "path=$(stack path --dist-dir)/doc/html/wrench" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.docs.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-binaries:
    needs:
      - wrench
      - haskell-lint
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies on *nix
        uses: actions/cache@v6
        if: startsWith(runner.os, 'Linux') || startsWith(runner.os, 'macOS')
        with:
          path: ${{ '~/.stack' }}
          key: build-binaries-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Cache dependencies on Windows
        if: startsWith(runner.os, 'Windows')
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Roaming\stack
            ~\AppData\Local\Programs\stack
            C:\sr
          key: build-binaries-job-${{ runner.os }}-${{ runner.arch }}-stack-${{ hashFiles('.stack-deps.txt') }}

      - name: Install haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
          ghc-version: "9.10.3"

      - name: Build binary
        run: |
          stack build --copy-bins --local-bin-path ./dist

      - name: Prepare release archive
        run: |
          tar -czvf wrench-${{ runner.os }}-${{ runner.arch }}.tar.gz -C ./dist .

      - name: Upload Binary as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wrench-${{ runner.os }}-${{ runner.arch }}
          path: wrench-${{ runner.os }}-${{ runner.arch }}.tar.gz

  publish-release:
    needs:
      - build-binaries
      - haskell-formatting
      - html-formatting
      - markdown-formatting
      - python-lint
      - python-typecheck
      - haskell-lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - run: find ./release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

  # use `make release-image` to trigger it
  deploy-release:
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: |
          curl -X POST -H "Content-Type: application/json" --fail-with-body \
            -d '{"task": "wrench-serv", "secret": "${{ secrets.DEPLOY_EDGE_WEBHOOK }}", "async":true}' \
            https://updater.edu.swampbuds.me/update

  build-edge-image:
    needs:
      - wrench
      - is-variants-and-tests-actual
      - is-stack-deps-actual
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: Dockerfile
          tags: ryukzak/wrench:edge
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            VERSION_SUFFIX=EDGE

  deploy-edge:
    needs: build-edge-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: |
          curl -X POST -H "Content-Type: application/json" --fail-with-body \
            -d '{"task": "wrench-serv-edge", "secret": "${{ secrets.DEPLOY_EDGE_WEBHOOK }}", "async":true}' \
            https://updater.edu.swampbuds.me/update
